syntax = "proto3";

option csharp_namespace = "OhMyBot.Contracts.Grpc";

package ohmybot.v2;

service CommandRouter {
  rpc ExecuteCommand (CommandRequest) returns (CommandResponse);
  rpc ExecuteCallback (CallbackRequest) returns (CommandResponse);
  rpc GetRoutes (GetRoutesRequest) returns (GetRoutesResponse);
  rpc RecordUserProfile (UserProfileRequest) returns (UserProfileResponse);
  rpc OpenAdminConsole (stream AdminConsoleInput) returns (stream AdminConsoleOutput);
  // QQ 数字菜单：网关发出菜单消息拿到 message_id 后绑定「消息 -> 选项列表」；用户回复序号后执行选择。
  rpc BindQqMenu (BindQqMenuRequest) returns (BindQqMenuResponse);
  rpc ExecuteQqMenuSelection (QqMenuSelectionRequest) returns (CommandResponse);
  // 平台侧待审批请求（加好友 / 邀请入群 / 加群申请）上报给 Core，由 Core 分发给插件。
  rpc ReportPlatformRequest (PlatformRequestReport) returns (PlatformRequestAck);
}

enum BotPlatform {
  BOT_PLATFORM_UNSPECIFIED = 0;
  BOT_PLATFORM_TELEGRAM = 1;
  BOT_PLATFORM_QQ = 2;
}

enum BotChatType {
  BOT_CHAT_TYPE_UNSPECIFIED = 0;
  BOT_CHAT_TYPE_PRIVATE = 1;
  BOT_CHAT_TYPE_GROUP = 2;
}

enum CommandMediaKind {
  COMMAND_MEDIA_KIND_UNKNOWN = 0;
  COMMAND_MEDIA_KIND_PHOTO = 1;
  COMMAND_MEDIA_KIND_ANIMATION = 2;
  COMMAND_MEDIA_KIND_VIDEO = 3;
  COMMAND_MEDIA_KIND_STICKER = 4;
  COMMAND_MEDIA_KIND_DOCUMENT = 5;
}

enum UserPrivilege {
  USER_PRIVILEGE_USER = 0;
  USER_PRIVILEGE_VERIFIED_USER = 1;
  USER_PRIVILEGE_ADMIN = 10;
  USER_PRIVILEGE_OWNER = 100;
}

// Telegram parse mode。Core 已把 text 按该模式转义好，网关直接透传给 SDK。
enum TelegramParseMode {
  TELEGRAM_PARSE_MODE_NONE = 0;
  TELEGRAM_PARSE_MODE_MARKDOWN_V2 = 1;
  TELEGRAM_PARSE_MODE_HTML = 2;
}

message CommandRequest {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  string chat_id = 3;
  string user_id = 4;
  string message_id = 5;
  string command = 6;
  repeated string args = 7;
  string display_name = 8;
  string username = 9;
  BotChatType chat_type = 10;
  string first_name = 11;
  string last_name = 12;
  string nickname = 13;
  string reply_to_user_id = 14;
  CommandMedia reply_media = 15;
}

// 命令所回复的平台媒体。媒体只由明确声明 accepts_reply_media 的命令接收。
message CommandMedia {
  string file_name = 1;
  string content_type = 2;
  bytes content = 3;
  int32 width = 4;
  int32 height = 5;
  CommandMediaKind kind = 6;
}

message CallbackRequest {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  string chat_id = 3;
  string user_id = 4;
  string message_id = 5;
  string callback_query_id = 6;
  string payload = 7;
  BotChatType chat_type = 8;         // 回调发生的会话类型；插件 handler 据此区分私聊/群聊
}

message GetRoutesRequest {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  int64 current_version = 3;
}

message UserProfileRequest {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  string uid = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
  string nickname = 7;
}

message UserProfileResponse {
  bool recorded = 1;
}

message AdminConsoleInput {
  string command_line = 1;
}

message AdminConsoleTextSegment {
  string text = 1;
  optional int32 foreground_color = 2;
  optional int32 background_color = 3;
}

message AdminConsoleOutput {
  repeated AdminConsoleTextSegment segments = 1;
}

message RouteDescriptor {
  string command = 1;
  string core_command = 2;
  string description = 3;
  string usage = 4;
  UserPrivilege required_privilege = 5;
  int32 support_platforms = 6;
  bool enabled = 7;
  repeated string aliases = 8;
  int32 support_chat_types = 9;
  bool accepts_reply_media = 10;
}

message GetRoutesResponse {
  repeated RouteDescriptor routes = 1;
  int64 version = 2;
  bool not_modified = 3;
}

message ResponseMessage {
  string text = 1;
}

message ResponseButton {
  string text = 1;
  string payload = 2;
}

message ResponseButtonRow {
  repeated ResponseButton buttons = 1;
}

message CommandError {
  string code = 1;
  string message = 2;
}

message CommandResponseContext {
  int64 caller_core_user_id = 1;
  UserPrivilege caller_privilege = 2;
  BotPlatform platform = 3;
}

// 一条已按 Telegram 渲染好的最终消息（text 已按 parse_mode 转义）。
message TelegramMessage {
  string text = 1;
  TelegramParseMode parse_mode = 2;
  repeated ResponseButtonRow button_rows = 3;
  string reply_to_message_id = 4;
  optional string edit_message_id = 5;
  TelegramDocument document = 6;
  TelegramSticker sticker = 7;
}

message TelegramDocument {
  string file_name = 1;
  string content_type = 2;
  bytes content = 3;
}

message TelegramSticker {
  string file_name = 1;
  string content_type = 2;
  bytes content = 3;
}

message TelegramResponse {
  repeated TelegramMessage messages = 1; // 空 = 静默不发
}

// 一条已按 QQ 渲染好的最终消息（纯文本，无 Markdown、无按钮）。
message QqMessage {
  string text = 1;
  // 非空 ⇒ 这是一条数字菜单：网关发出后需调用 BindQqMenu 把「消息 id -> 选项 payload 列表」写入 Core。
  // 菜单选项文本已内嵌在 text 中，网关无需理解选项内容。
  string menu_token = 2;
}

message QqResponse {
  repeated QqMessage messages = 1; // 空 = 静默不发
}

message CommandResponse {
  int32 code = 1;
  string error_code = 2;
  CommandResponseContext context = 3;
  string callback_answer_text = 4;   // 回调用，非 per-message
  bool callback_answer_alert = 5;
  oneof platform_response {           // 空 = 静默不发
    TelegramResponse telegram = 30;
    QqResponse qq = 31;
  }
}

message NotificationEvent {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  string chat_id = 3;
  repeated ResponseMessage messages = 4;
  repeated ResponseButton buttons = 5;
}

// 绑定一条已发出的 QQ 菜单消息到其选项列表（存入 Redis）。
message BindQqMenuRequest {
  string bot_instance_id = 1;
  string chat_id = 2;
  string message_id = 3;   // 已发出的菜单消息 id
  string sender_id = 4;    // 私聊裸数字回退：该用户最近一次菜单指针
  BotChatType chat_type = 5;
  string menu_token = 6;   // QqMessage.menu_token
}

message BindQqMenuResponse {
  bool bound = 1;
}

// 用户回复/发送序号选择某个菜单项。
message QqMenuSelectionRequest {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  string chat_id = 3;
  string user_id = 4;
  string message_id = 5;             // 用户这条选择消息的 id
  string reply_to_message_id = 6;    // 被回复的菜单消息 id（群聊必填；私聊裸数字为空，走 latest 指针）
  BotChatType chat_type = 7;
  string selection = 8;              // 用户输入，例如 "1"
}

// 平台侧需要人工审批的请求类型。
enum PlatformRequestKind {
  PLATFORM_REQUEST_KIND_UNSPECIFIED = 0;
  PLATFORM_REQUEST_KIND_FRIEND_ADD = 1;    // 加机器人为好友
  PLATFORM_REQUEST_KIND_GROUP_INVITE = 2;  // 邀请机器人进群
  PLATFORM_REQUEST_KIND_GROUP_ADD = 3;     // 机器人为群管理时收到的入群申请
}

// 网关把待审批请求上报给 Core。flag 是平台侧的审批句柄，Core 不解释其内容，
// 审批时原样回传给网关，由网关翻译成平台协议动作。
message PlatformRequestReport {
  BotPlatform platform = 1;
  string bot_instance_id = 2;
  PlatformRequestKind kind = 3;
  string flag = 4;
  string requester_id = 5;
  string requester_name = 6;
  string group_id = 7;       // 群相关请求才有
  string comment = 8;        // 申请附言 / 验证消息
  int64 occurred_at = 9;     // Unix 秒
  // 申请人档案的补充字段（昵称、性别、等级、头像等），键见 PlatformRequestProfileKeys。
  // Core 不解释内容，只负责透传给插件，新增字段无需改协议。
  map<string, string> requester_profile = 10;
}

message PlatformRequestAck {
  bool accepted = 1;         // 是否有插件受理；false 表示无人监听，网关只记日志
}
